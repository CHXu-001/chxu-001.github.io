<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700&display=swap"
      rel="stylesheet"
    >
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #1c281d;
        font-family: "Merriweather", serif;
      }

      main {
        width: min(calc(100% - 2rem), 680px);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 2.2rem;
        font-weight: 300;
      }

      p {
        margin: 0 0 1rem;
        line-height: 1.8;
      }

      a {
        color: #00ab37;
        text-decoration: none;
      }

      a:hover {
        color: #b509ac;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page Not Found</h1>
      <p>The page you requested does not exist.</p>
      <p><a href="/">Return to the homepage</a></p>
    </main>
  </body>
</html>
